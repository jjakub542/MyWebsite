{{template "base" .}}

{{define "title"}}Admin Login{{end}}

{{define "content"}}
<div class="row">
    <div class="col s12 m6 offset-m3">
        <div class="card">
            <div class="card-content">
                <span class="card-title">Admin Login</span>
                
                <!-- Renders if your Go handler passes an Error string -->
                {{if .Error}}
                <div class="card-panel red lighten-4 red-text text-darken-4" style="padding: 10px; border-radius: 4px;">
                    {{.Error}}
                </div>
                {{end}}

                <form action="/login" method="POST">
                    <div class="input-field">
                        <!-- If your backend logic uses emails instead of usernames, change name="username" to name="email" -->
                        <input type="text" id="username" name="username" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="input-field">
                        <input type="password" id="password" name="password" required>
                        <label for="password">Password</label>
                    </div>
                    <button class="btn blue-grey darken-3 waves-effect waves-light" type="submit" style="width: 100%; margin-top: 1rem;">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
